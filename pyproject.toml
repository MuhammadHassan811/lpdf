[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lpdf"
version = "0.1.0"
description = "LLM-Based Protein Design Framework: reference implementation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0", "numpy>=1.24"]

[project.optional-dependencies]
# Needed only for metrics.paired_wilcoxon, the protocol's paired test.
stats = ["scipy>=1.11"]
dev = ["pytest>=7.4", "scipy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
